[project]
name = "speech-to-text-whisper-tkinter"
version = "0.1.0"
description = "Speech-to-text with Whisper, CustomTkinter UI, optional text smoothing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2.0",
    "keyboard>=0.13.5",
    "numpy>=1.26.0",
    "openai>=1.3.0",
    "pyautogui>=0.9.54",
    "pyperclip>=1.8.2",
    "scipy>=1.11.0",
    "setuptools>=65.0.0",
    "sounddevice>=0.4.6",
    "httpx<0.27",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

